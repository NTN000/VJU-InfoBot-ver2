<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng thông tin tuyển sinh Đại học Việt Nhật (VJU) - ĐHQGHN</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            /* Nâng cấp 1: Fix lỗi đường dẫn hiển thị hình con cá ca.jpg ra ngoài cùng */
            background-image: url('/ca.jpg') !important; 
            background-size: cover !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            font-family: 'Be Vietnam Pro', sans-serif;
            overflow: hidden;
        }

        /* Nâng cấp 2: Đưa bong bóng chat tròn về đúng GÓC DƯỚI BÊN PHẢI */
        #chat-bubble {
            position: fixed !important;
            bottom: 20px !important;
            right: 20px !important; 
            left: auto !important;
            width: 60px;
            height: 60px;
            background-color: #b31d24;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 10000;
            transition: transform 0.2s ease;
        }

        #chat-bubble:hover { 
            transform: scale(1.1); 
        }

        /* Nâng cấp 2: Đưa khung hộp thoại về đúng GÓC DƯỚI BÊN PHẢI */
        .chat-container {
            position: fixed !important;
            bottom: 95px !important;
            right: 20px !important; 
            left: auto !important;
            width: 380px;
            height: 520px;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 9999;
            border: 1px solid #e2e8f0;
        }

        .chat-container.active { 
            display: flex !important; 
        }

        .chat-header {
            background-color: #b31d24 !important;
            color: white !important;
            padding: 12px 15px;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Nâng cấp 3: Đặt Logo trường ở góc TRÊN BÊN TRÁI thanh tiêu đề */
        .vju-logo-header {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background-color: white;
            object-fit: contain;
            display: block;
        }

        /* Nâng cấp 3: Đặt nút thùng rác nằm ở góc TRÊN BÊN PHẢI thanh tiêu đề */
        #clear-btn {
            background: transparent;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        #clear-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .chat-body {
            position: relative; /* Thêm để định vị nút cuộn tương đối với chat-body */
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            scroll-behavior: smooth !important;
            background-image: url('/logo-vju-red.png') !important;
            background-repeat: no-repeat !important;
            background-position: center center !important;
            background-size: 70% !important;
            background-color: rgba(255, 255, 255, 0.94) !important;
            background-blend-mode: overlay !important;
        }

        .chat-body::-webkit-scrollbar { width: 5px; }
        .chat-body::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* NÂNG CẤP BƯỚC 3: Thêm CSS cho nút tròn đỏ cuộn nhanh xuống đáy chat */
        #scroll-down-btn {
            position: fixed;
            bottom: 160px;
            right: 35px;
            width: 36px;
            height: 36px;
            background-color: #b31d24;
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            display: none; /* Mặc định ẩn, JS sẽ xử lý hiện khi lướt lên */
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            z-index: 10001;
            transition: transform 0.2s, opacity 0.2s;
        }
        #scroll-down-btn:hover {
            transform: scale(1.1);
            background-color: #d32f2f;
        }

        .chat-footer { 
            padding: 12px; 
            background-color: #f8fafc; 
            border-top: 1px solid #e2e8f0; 
            display: flex; 
            gap: 8px; 
        }

        #user-input { 
            flex: 1; 
            padding: 10px 14px; 
            border: 1px solid #cbd5e1; 
            border-radius: 20px; 
            outline: none; 
            font-size: 14px; 
        }

        #send-btn { 
            background-color: #b31d24; 
            color: white; 
            border: none; 
            width: 38px; 
            height: 38px; 
            border-radius: 50%; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        .message { margin-bottom: 14px; display: flex; width: 100%; box-sizing: border-box; }
        .user-message { justify-content: flex-end; }
        .bot-message { justify-content: flex-start; }
        .message-wrapper { display: flex; flex-direction: column; max-width: 80%; }
        .user-message .message-wrapper { align-items: flex-end; }
        .bot-message .message-wrapper { align-items: flex-start; }

        .message-content { padding: 10px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.5; word-wrap: break-word; display: inline-block; }
        .user-message .message-content { background-color: #b31d24; color: white; border-bottom-right-radius: 2px; }
        .bot-message .message-content { background-color: #f1f5f9; color: #1e293b; border-bottom-left-radius: 2px; border: 1px solid #e2e8f0; }

        .timestamp { font-size: 10px; color: #94a3b8; margin-top: 3px; padding: 0 4px; }

        /* ==========================================================================
           NÂNG CẤP CHUẨN: Thiết kế bong bóng dấu 3 chấm nảy đều nhịp nhàng (Messenger style)
           ========================================================================== */
        .typing-dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 4px 2px 4px;
        }
        .typing-dots span {
            width: 7px;
            height: 7px;
            background-color: #64748b;
            border-radius: 50%;
            display: inline-block;
            animation: dotBounce 1.4s infinite ease-in-out both;
        }
        /* Phân chia delay chuẩn xác cho cả 3 dấu chấm */
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        .typing-dots span:nth-child(3) { animation-delay: 0s; }

        /* Keyframes nâng cấp: Co giãn nhẹ và thay đổi độ mờ liên tục tạo hiệu ứng gợn sóng mượt mà */
        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0.3); opacity: 0.4; }
            40% { transform: scale(1.1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="chat-bubble">💬</div>

    <div id="chat-widget" class="chat-container">
        <div class="chat-header">
            <div class="header-left">
                <img class="vju-logo-header" src="/logo-vju-red.png" onerror="this.src='https://vju.ac.vn/wp-content/uploads/2021/08/logo-vju-red.png'" alt="VJU">
                <span class="header-title" style="font-family: 'Be Vietnam Pro', sans-serif; font-weight: 600;">VJU InfoBot</span>
            </div>
            <button id="clear-btn" title="Xóa lịch sử trò chuyện">🗑️</button>
        </div>
        
        <div id="chat-body" class="chat-body"></div>

        <button id="scroll-down-btn" title="Cuộn xuống dưới">↓</button>
        
        <div class="chat-footer">
            <input type="text" id="user-input" placeholder="Nhập câu hỏi hoặc số thứ tự từ menu..." autocomplete="off">
            <button id="send-btn">🚀</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const chatBubble = document.getElementById("chat-bubble");
            const chatWidget = document.getElementById("chat-widget");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const chatBody = document.getElementById("chat-body");
            const clearBtn = document.getElementById("clear-btn");
            
            // NÂNG CẤP BƯỚC 3: Lấy đối tượng nút đỏ từ DOM
            const scrollDownBtn = document.getElementById("scroll-down-btn");

            function getCurrentTime() {
                const now = new Date();
                return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            }

            // Tự động tải câu chào từ Server
            async function loadInitialMenu() {
                try {
                    const response = await fetch("/api/init-menu");
                    if (response.ok) {
                        const data = await response.json();
                        appendMessage(data.response, "bot-message");
                    }
                } catch (error) { console.error(error); }
            }
            loadInitialMenu();

            // Đóng mở khung chat widget
            if (chatBubble && chatWidget) {
                chatBubble.addEventListener("click", function (e) {
                    e.stopPropagation();
                    chatWidget.classList.toggle("active");
                });
            }

            // Click nút Thùng rác xóa lịch sử chat (Đã liên kết chuẩn /api/reset-chat phía backend)
            if (clearBtn) {
                clearBtn.addEventListener("click", async function (e) {
                    e.stopPropagation();
                    if (confirm("Bạn có muốn xóa sạch toàn bộ đoạn hội thoại này không?")) {
                        try {
                            const response = await fetch("/api/reset-chat", { method: "POST" });
                            if (response.ok) {
                                chatBody.innerHTML = '';
                                const data = await response.json();
                                appendMessage(data.response, "bot-message");
                            }
                        } catch (error) { chatBody.innerHTML = ''; loadInitialMenu(); }
                    }
                });
            }

            // Gửi tin nhắn nhận dữ liệu STREAM có hiệu ứng 3 chấm động gõ chữ
            async function sendMessage() {
                const messageText = userInput.value.trim();
                if (!messageText) return;

                appendMessage(messageText, "user-message");
                userInput.value = ""; 

                // ==========================================================================
                // NÂNG CẤP CHUẨN: Đủ cấu trúc 3 thẻ span đại diện cho 3 dấu chấm chuyển động nhấp nháy
                // ==========================================================================
                const placeholderBubble = appendMessage(
                    `<div class="typing-dots"><span></span><span></span><span></span></div>`, 
                    "bot-message", 
                    true
                );

                try {
                    const response = await fetch("/api/chat-stream", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: messageText })
                    });

                    if (response.ok) {
                        const contentSpan = placeholderBubble.querySelector(".message-content");
                        contentSpan.innerHTML = ""; // Xóa ba chấm khi AI bắt đầu trả chữ ra
                        
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder('utf-8');
                        let fullResponseText = "";

                        while (true) {
                            const { value, done } = await reader.read();
                            if (done) break;
                            fullResponseText += decoder.decode(value, { stream: true });

                            if (typeof marked !== "undefined" && typeof marked.parse === "function") {
                                contentSpan.innerHTML = marked.parse(fullResponseText);
                            } else {
                                contentSpan.innerHTML = fullResponseText.replace(/\n/g, "<br>");
                            }
                            chatBody.scrollTop = chatBody.scrollHeight;
                        }
                    } else { placeholderBubble.querySelector(".message-content").innerText = "Lỗi kết nối máy chủ!"; }
                } catch (error) { placeholderBubble.querySelector(".message-content").innerText = "Không thể kết nối chatbot."; }
                chatBody.scrollTop = chatBody.scrollHeight;
            }

            function appendMessage(text, className, isHTML = false) {
                const messageDiv = document.createElement("div");
                messageDiv.className = `message ${className}`;
                
                const contentWrapper = document.createElement("div");
                contentWrapper.className = "message-wrapper";

                const textSpan = document.createElement("span");
                textSpan.className = "message-content";
                
                if (isHTML) {
                    textSpan.innerHTML = text;
                } else if (className === "bot-message" && typeof marked !== "undefined" && typeof marked.parse === "function") {
                    textSpan.innerHTML = marked.parse(text);
                } else {
                    textSpan.innerHTML = text.replace(/\n/g, "<br>");
                }
                
                const timeSpan = document.createElement("span");
                timeSpan.className = "timestamp";
                timeSpan.innerText = getCurrentTime();

                contentWrapper.appendChild(textSpan);
                contentWrapper.appendChild(timeSpan);
                messageDiv.appendChild(contentWrapper);
                chatBody.appendChild(messageDiv);
                chatBody.scrollTop = chatBody.scrollHeight;
                return messageDiv;
            }

            if (sendBtn) sendBtn.addEventListener("click", sendMessage);
            if (userInput) { userInput.addEventListener("keypress", function (e) { if (e.key === "Enter") sendMessage(); }); }

            // ==========================================================================
            // NÂNG CẤP BƯỚC 3: LOGIC THEO DÕI THANH CUỘN ĐỂ ẨN/HIỆN VÀ CLICK CHO NÚT ĐỎ
            // ==========================================================================
            if (chatBody && scrollDownBtn) {
                chatBody.addEventListener("scroll", function () {
                    // Tính khoảng cách từ vị trí hiện tại đến đáy thực tế của hộp chat
                    const distanceFromBottom = chatBody.scrollHeight - chatBody.scrollTop - chatBody.clientHeight;

                    // Nếu người dùng lướt lên trên (cách đáy > 150px) -> Hiện nút đỏ, ngược lại ẩn đi
                    if (distanceFromBottom > 150) {
                        scrollDownBtn.style.display = "flex";
                    } else {
                        scrollDownBtn.style.display = "none";
                    }
                });

                // Khi click vào nút đỏ -> Thực hiện hành động cuộn mượt xuống đáy
                scrollDownBtn.addEventListener("click", function (e) {
                    e.stopPropagation();
                    chatBody.scrollTo({
                        top: chatBody.scrollHeight,
                        behavior: "smooth"
                    });
                });
            }
        });
    </script>
</body>
</html>
